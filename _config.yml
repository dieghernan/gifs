# Site configuration
remote_theme: dieghernan/chulapa

# Site identity and SEO
locale: es-ES
og_locale: es_ES
title: GIFs
subtitle: Grandes incendios forestales en España
description: Infografía de grandes incendios forestales en España, elaborada con R a partir de datos de MITECO.
url: https://dieghernan.github.io
baseurl: "/gifs"
repository: dieghernan/gifs
timezone: Europe/Madrid

# Sharing images
og_image: https://dieghernan.github.io/gifs/assets/social-preview.jpg
og_image_alt: Grandes incendios forestales en España, 2010–2025. Mapa oscuro con
  círculos naranjas proporcionales a la superficie forestal quemada.
og_image_width: 1200
og_image_height: 630
og_image_type: image/jpeg

twitter_site: dhernangomez

# Author and publisher
author:
  name: dieghernan
  url: https://dieghernan.github.io/
  avatar: https://dieghernan.github.io/assets/img/site/avatar.png
  location: Madrid, España
  links:
  - url: https://x.com/dhernangomez
    icon: fab fa-square-x-twitter
    label: Twitter/X
  - url: https://fosstodon.org/@dhernangomez
    icon: fa-brands fa-mastodon
    label: Mastodon
  - url: https://bsky.app/profile/dieghernan.bsky.social
    icon: fa-brands fa-square-bluesky
    label: Bluesky
  - url: https://github.com/dieghernan/
    icon: fab fa-github
    label: GitHub
  - url: https://stackoverflow.com/users/7877917/dieghernan
    icon: fab fa-stack-overflow
    label: Stack Overflow
  - url: https://orcid.org/0000-0001-8457-4658
    icon: fa-brands fa-orcid
    label: ORCID
publisher:
  type: Person
  name: dieghernan
  url: https://dieghernan.github.io/
  image: https://dieghernan.github.io/assets/img/site/avatar.png

# Navigation
navbar:
  expand: never
  brand:
    title: '<i class="fa-solid fa-fire" aria-hidden="true"></i><span class="sr-only">Inicio: grandes incendios forestales</span>'
footer:
  links:
  - label: Stack Overflow
    icon: fab fa-stack-overflow
    url: https://stackoverflow.com/users/7877917/dieghernan
  - label: GitHub
    icon: fab fa-github
    url: https://github.com/dieghernan/
  - label: Blog
    icon: fas fa-blog
    url: https://dieghernan.github.io/
  - label: RPubs
    icon: fab fa-r-project
    url: https://rpubs.com/dieghernan

# Appearance
googlefonts:
- url: https://fonts.googleapis.com/css2?family=Fira+Code&family=Fira+Sans&display=swap
chulapa-skin:
  autothemer: true
  skin: deeply
  vars:
    font-family-base: Fira Sans
    headings-font-family: Fira Sans
    font-family-monospace: '"Fira Code", monospace'

# Content and build settings
defaults:
- scope:
    path: ''
  values:
    layout: default
    header_type: base
    show_sociallinks: true
include:
- _pages
compress_html:
  clippings: all
  blanklines: true
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: "&uarr;"
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
incremental: false
exclude:
- scripts
- LICENSE
- README.md
- Gemfile
- vendor
- rdata
- AGENTS.md
- Gemfile.lock
- ".bundle"
plugins:
- jekyll-remote-theme
- jekyll-github-metadata
- jekyll-include-cache
- jekyll-sitemap
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
  - global-builtin
  - color-functions
  - abs-percent
  - function-units
  - if-function
