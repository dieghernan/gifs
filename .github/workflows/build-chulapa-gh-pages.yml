name: Deploy Chulapa Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site with Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-croissant.txt
      - name: Install Croissant validator
        run: python -m pip install -r scripts/requirements-croissant.txt -r scripts/requirements-microformats.txt
      - name: Check generated Croissant metadata
        run: python scripts/build_croissant.py --check
      - name: Check generated EGIF products
        run: python scripts/build_dataset.py --check
      - name: Validate Croissant descriptor
        run: |
          mlcroissant validate --jsonld croissant/parts.json
          mlcroissant validate --jsonld croissant/fires.json
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: .
      - name: Check generated citation
        run: ruby scripts/citation.rb --check
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        working-directory: .
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check dataset metadata
        run: python -m unittest discover -s tests
      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  push-gh-pages:
    name: Push site to gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the same built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact
      - name: Unpack site
        run: |
          mkdir -p published-site
          tar -xf pages-artifact/artifact.tar -C published-site
          touch published-site/.nojekyll
      - name: Update gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: published-site
